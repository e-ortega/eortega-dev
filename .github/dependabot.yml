version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 0 = no routine version-bump PRs; security updates still come through.
    open-pull-requests-limit: 0
    groups:
      # vite and its React plugin must be upgraded together: the plugin declares the vite versions it
      # supports as a peer dependency, so bumping vite alone breaks `npm ci` (happened with vite 5 -> 8).
      vite:
        applies-to: security-updates
        patterns:
          - "vite"
          - "@vitejs/*"
