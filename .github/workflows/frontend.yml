name: Frontend

on:
  push:
    branches: [main]
    paths-ignore: ["infra/**", "**/*.md", ".github/workflows/infra.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write # para que el deploy comente la URL del preview en el PR

concurrency:
  # Por PR o por rama. Ojo: al mergear, el evento "closed" del PR llega con github.ref = refs/heads/main,
  # así que agrupar solo por github.ref hacía que el cierre del preview cancelara el deploy a producción.
  group: frontend-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Solo se cancelan builds viejos de un mismo PR; un deploy a producción nunca se corta a la mitad.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  SWA_NAME: ${{ vars.SWA_NAME }}

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # El token de deploy se pide en cada corrida: si el recurso se recrea, no hay secreto que actualizar.
      - name: Token de deploy
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "$SWA_NAME" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # Solo el token de deploy, sin github_id_token: con id token, el servidor identifica el sitio
      # por el nombre del archivo de workflow (exige azure-static-web-apps-<adj>-<noun>-<hex>.yml).
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist # ya compilado arriba
          skip_app_build: true
          api_location: ""

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Token de deploy
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "$SWA_NAME" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: close
