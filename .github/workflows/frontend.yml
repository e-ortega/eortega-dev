name: Frontend

on:
  push:
    branches: [main]
    paths-ignore: ["infra/**", "**/*.md", ".github/workflows/infra.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write # para que el deploy comente la URL del preview en el PR

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  SWA_NAME: ${{ vars.SWA_NAME }}

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # El token de deploy se pide en cada corrida: si el recurso se recrea, no hay secreto que actualizar.
      - name: Token de deploy
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "$SWA_NAME" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # El recurso conserva deploymentAuthPolicy=GitHub (no se puede cambiar sin PAT): se manda
      # también el token OIDC de GitHub, igual que el workflow que generó Azure.
      - name: GitHub ID token
        id: idtoken
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: return await core.getIDToken()

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist # ya compilado arriba
          skip_app_build: true
          api_location: ""

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Token de deploy
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "$SWA_NAME" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: close
