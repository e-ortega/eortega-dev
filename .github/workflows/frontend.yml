name: Frontend

on:
  push:
    branches: [main]
    paths-ignore: ["infra/**", "**/*.md", ".github/workflows/infra.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write # lets the deploy action comment the preview URL on the PR

concurrency:
  # Per PR or per branch. Note: on merge, the PR "closed" event arrives with github.ref = refs/heads/main,
  # so grouping by github.ref alone made the preview teardown cancel the production deploy.
  group: frontend-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only stale builds of the same PR get cancelled; a production deploy is never cut off midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  SWA_NAME: ${{ vars.SWA_NAME }}

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The deployment token is fetched on every run: if the resource is recreated, there is no secret to update.
      - name: Get deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "$SWA_NAME" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # Deployment token only, no github_id_token: with an id token, the service identifies the site by the
      # workflow file name (it requires azure-static-web-apps-<adj>-<noun>-<hex>.yml).
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist # already built above
          skip_app_build: true
          api_location: ""

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "$SWA_NAME" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: close
